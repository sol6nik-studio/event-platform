packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true

catalog:
  '@fastify/cookie': 11.1.2
  '@fastify/cors': 11.3.0
  '@fastify/rate-limit': 11.2.0
  '@nestjs/common': 12.0.1
  '@nestjs/core': 12.0.1
  '@nestjs/platform-fastify': 12.0.1
  '@nestjs/swagger': 12.0.1
  argon2: 0.45.1
  bullmq: 6.3.4
  class-transformer: 0.5.1
  class-validator: 0.15.1
  fastify: 5.12.1
  ioredis: 5.6.1
  jose: 6.2.10
  lucide-react: 1.38.0
  next: 16.3.4
  react: 19.2.8
  react-dom: 19.2.8
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  zod: 4.5.4

catalogMode: strict

cleanupUnusedCatalogs: true

linkWorkspacePackages: true

preferWorkspacePackages: true

sharedWorkspaceLockfile: true

overrides:
  deepmerge-ts: 8.0.0
  mysql2: 3.23.1
