packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true

catalog:
  '@fastify/cookie': 11.1.2
  '@fastify/cors': 11.3.0
  '@fastify/rate-limit': 11.2.0
  '@fastify/static': 10.1.5
  '@nestjs/common': 12.1.1
  '@nestjs/core': 12.1.1
  '@nestjs/platform-fastify': 12.1.1
  '@nestjs/swagger': 12.0.2
  '@types/react': 19.3.0
  argon2: 0.45.1
  bullmq: 6.3.9
  class-transformer: 0.5.1
  class-validator: 0.15.1
  fastify: 5.12.5
  ioredis: 6.0.0
  jose: 6.2.12
  lucide-react: 1.48.0
  next: 16.3.6
  react: 19.3.0
  react-dom: 19.3.0
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  zod: 4.6.5

catalogMode: strict

cleanupUnusedCatalogs: true

linkWorkspacePackages: true

preferWorkspacePackages: true

sharedWorkspaceLockfile: true

overrides:
  deepmerge-ts: 8.0.0
  mysql2: 3.23.1
