services:
  db-seed:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    command: >-
      sh -c "pnpm --filter @arena-grid/database exec prisma db push --skip-generate && pnpm --filter
      @arena-grid/database db:seed"
    environment:
      NODE_ENV: development
      SEED_DEMO_DATA: 'true'
      DATABASE_URL: postgresql://${POSTGRES_USER:-arena_grid}:${POSTGRES_PASSWORD:-arena_grid_local_only}@postgres:5432/${POSTGRES_DB:-arena_grid}?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    command: pnpm --filter @arena-grid/api dev
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: postgresql://${POSTGRES_USER:-arena_grid}:${POSTGRES_PASSWORD:-arena_grid_local_only}@postgres:5432/${POSTGRES_DB:-arena_grid}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local_only_do_not_use_in_any_shared_or_production_environment}
    depends_on:
      db-seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      otel-collector: { condition: service_started }

  worker:
    command: pnpm --filter @arena-grid/worker dev
    depends_on:
      db-seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      otel-collector: { condition: service_started }

  web:
    command: pnpm --filter @arena-grid/web dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    depends_on:
      api: { condition: service_started }
