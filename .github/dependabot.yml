version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint 8 does not support the TypeScript 7 compiler API yet.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Keep Node.js types aligned with the Node.js 24 runtime declared by the project.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: monthly
    ignore:
      # Runtime upgrades are coordinated with package.json and CI.
      - dependency-name: node
        update-types:
          - version-update:semver-major
